# GLM-OCR SDK config for medical papers import pipeline
# vLLM service: glm-ocr on port 18080
# Layout detection: PP-DocLayoutV3 (local)

logging:
  level: WARNING

pipeline:
  maas:
    enabled: false

  ocr_api:
    api_host: 127.0.0.1
    api_port: 18080
    model: glm-ocr
    api_mode: openai
    api_path: /v1/chat/completions
    verify_ssl: false
    connect_timeout: 30
    request_timeout: 300
    max_workers: 4

  page_loader:
    max_tokens: 2048
    pdf_dpi: 200
    pdf_max_pages: null

  result_formatter:
    output_format: markdown

  layout:
    model_dir: /data/wilson_2/de/models/PaddlePaddle/PP-DocLayoutV3_safetensors
    batch_size: 1
    workers: 1
    cuda_visible_devices: "1"
    device: cuda:1
