# GLM-OCR v3 统一服务配置
#
# 在 v2 队列能力之上，对 layout 产物 imgs/ 做二次 VL 文本化（流程图 Mermaid /
# 表格 / Image Caption 等）。环境变量仍可覆盖同名运行参数。

service:
  host: 127.0.0.1
  port: 18094
  sdk_config: code/glm_ocr/config/glm_ocr.yaml
  layout_device: cuda:1
  output_root: result/glm_ocr/framework_v3

queues:
  pdf_layout:
    capacity: 4
    workers: 2
    # 每个 Worker 使用独立 SDK Parser。
  image_layout:
    capacity: 8
    workers: 1
    # 病例整页图片及 image_mode=layout。
  model_only:
    capacity: 8
    workers: 4
    # 裁剪图直接访问 vLLM，不执行 Layout。

vllm:
  url: http://127.0.0.1:18080/v1/chat/completions
  model: glm-ocr
  timeout: 300
  max_tokens: 4096
  # vLLM 独占卡 2；其进程参数仍由 deploy/ocr-vllm/config.env 管理。
  device: 2
  gpu_memory_utilization: 0.6
  max_model_len: 8192

# model_only 路径的 OCR prompt（layout/SDK 路径不受此项影响）。
ocr:
  default_prompt_profile: en
  prompt_profiles:
    en: "Text Recognition:"
  # 版面流程不变（GlmOcr + PP-DocLayout）；仅切换底层区域 OCR 的 vLLM。
  # glm → :18080 / glm-ocr；paddle → :18081 / PaddleOCR-VL-1.6
  # 请求参数 ocr_engine 可覆盖；默认 glm。
  default_engine: glm
  engines:
    glm:
      # 使用上方 vllm + service.sdk_config
      sdk_config: null
    paddle:
      sdk_config: code/glm_ocr/config/glm_ocr_paddle_vllm.yaml
      vllm_url: http://127.0.0.1:18081/v1/chat/completions
      vllm_model: PaddleOCR-VL-1.6

# Layout 完成后，对 imgs/ 中的 chart/image 裁剪再调一次 VL，生成 Mermaid。
# 流程图专用模型：Qwen3.5-9B（与正文 OCR 的 glm-ocr 分离）。
# prompt 默认 mermaid_clinical（临床 flowchart → Mermaid）。
figure_enrichment:
  enabled: true
  max_images: 64
  max_workers: 2
  timeout: 600
  max_tokens: 8192
  prompt_profile: mermaid_clinical
  fallback_prompt_profile: none
  # 本机 Qwen3.5-9B vLLM（flowchart → Mermaid），与 glm-ocr :18080 分离。
  # 示例启动：
  #   vllm serve /data/wilson_2/de/models/Qwen/Qwen3.5-9B \
  #     --served-model-name qwen3.5-9b --dtype bfloat16 \
  #     --gpu-memory-utilization 0.90 --max-model-len 128000 \
  #     --max-num-seqs 4 --max-num-batched-tokens 128000 \
  #     --trust-remote-code --port 18003
  # Accepts either .../v1 or .../v1/chat/completions.
  vllm_url: http://127.0.0.1:18003/v1
  vllm_model: qwen3.5-9b
  # 也可写死自定义 prompt / fallback_prompt 覆盖 profile。
  # prompt: |
  # fallback_prompt: |

# Layout 完成后，对段落标题 / 段落翻译（Mermaid/代码块不译）。
# 请求参数 translate 默认 false；translate_provider 默认 llm。
# translate_model 选择 models 下的键（仅 provider=llm）；默认 default_llm。
# provider=google 时须传入 google_api_key；provider=baidu 时须传入
# baidu_app_id + baidu_secret_key（或 baidu_api_key=appid:secret）。凭证不落盘。
translation:
  enabled: true
  default_provider: llm
  default_llm: qwen3.5-9b
  target_language: Simplified Chinese
  source_language: en
  max_workers: 8
  timeout: 300
  max_tokens: 4096
  max_segments: 2000
  google_batch_size: 40
  # 同类段落（先全部标题、再全部正文）用 <<<OCR_SEG_ID_n>>> 拼批翻译，再拆回。
  # 实际批大小会再按 max_tokens 收紧，避免超过 LLM 最大输出长度。
  merge_segments: true
  merge_max_chars: 3500
  # ≤ 该长度的段落视为「小段落」，会拼批翻译；更大的段落单独译。
  merge_small_para_chars: 1200
  # 全局兜底 prompt（仅当模型未指定 prompt / prompt_profile 时；医学长模板）。
  # prompt: |
  models:
    qwen3.5-9b:
      vllm_url: http://127.0.0.1:18003/v1
      vllm_model: qwen3.5-9b
      max_tokens: 4096
      temperature: 0.0
      # 不写 prompt → 用内置医学长模板 DEFAULT_TRANSLATE_PROMPT
      chat_template_kwargs:
        enable_thinking: false
    hy-mt2-18:
      # 示例启动：
      #   vllm serve .../Tencent-Hunyuan--Hy-MT2-1.8B/... \
      #     --served-model-name hy-mt2-18 --dtype bfloat16 \
      #     --gpu-memory-utilization 0.2 --max-model-len 32768 \
      #     --max-num-seqs 16 --max-num-batched-tokens 32768 \
      #     --trust-remote-code --port 18004
      vllm_url: http://127.0.0.1:18004/v1
      vllm_model: hy-mt2-18
      max_tokens: 4096
      temperature: 0.7
      top_p: 0.6
      top_k: 20
      repetition_penalty: 1.05
      # 官方风格短 prompt（英→中），与 Qwen 医学模板分离。
      prompt_profile: hy_mt_en2zh

# /parse_oss 的 OSS 凭据仅从仓库根目录 .env（gitignore）注入，不要写在本 YAML
# 或可提交的 deploy/glm-ocr-v3/config.env 中。所需环境变量：
#   OSS_ENDPOINT / OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET / OSS_BUCKET_NAME
#   OSS_PREFIX（可选，默认 glm_ocr_output）
#   OSS_SIGNED_URL_EXPIRES_SECONDS（可选，默认 3600）
# 外层通过 /results/{job_id} 主动轮询任务状态，不需要反向回调。

layout:
  device: cuda:1
  physical_device: 1
  memory_gb: 96
  parser_instances:
    pdf: 2
    image: 1

ppu:
  sdk: /usr/local/PPU_SDK
  home: /usr/local/PPU_SDK
  cuda_path: /usr/local/PPU_SDK/CUDA_SDK
  rtc_cache_dir: /data/wilson_2/cache/rtccache
  rtc_cache_link: /home/whs/.rtccache

runtime:
  python: /data/wilson_2/soft/miniforge3/envs/med_rag_cuda/bin/python
  log_file: code/glm_ocr/logs/glm_ocr_v3_service.log
  pid_file: code/glm_ocr/logs/glm_ocr_v3_service.pid
